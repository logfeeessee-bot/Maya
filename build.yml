name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain --stacktrace 2>&1 | tee build.log

      - name: Show real errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |What went wrong|Execution failed|Could not|Unresolved|error:" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Maya-APK
          path: app/build/outputs/apk/debug/*.apk
