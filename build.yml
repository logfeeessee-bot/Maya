name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
          cache-disabled: true

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain --stacktrace 2>&1 | tee build.log

      - name: Show real errors
        if: failure()
        shell: bash
        run: |
          if [ -f build.log ]; then
            if grep -qE "^e: " build.log; then
              out=$(grep -E "^e: " build.log | head -12)
            else
              out=$(grep -vE "^\s*$" build.log | tail -30)
            fi
            enc=$(printf '%s\n' "$out" | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=ASLI GALTI::$enc"
          else
            echo "::error title=ASLI GALTI::build.log nahi bana"
          fi

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Maya-APK
          path: app/build/outputs/apk/debug/*.apk
