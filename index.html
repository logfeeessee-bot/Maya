<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayra AI</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<div class="top">
  <h1>Mayra</h1>
  <button onclick="openSettings()">⚙️</button>
</div>

<div id="canvas-wrap">
  <div class="orb-rings"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
  <canvas id="particleCanvas"></canvas>
  <div class="maya-center">
    <h2>M.A.Y.A</h2>
    <div id="statusText">Mayra chup hai</div>
  </div>
</div>

<div class="controls">
  <button class="btn-main" onclick="startListening()">Mayra se bulwao</button>
</div>

<div class="bottom-bar">
  <div class="chips">
    <div class="chip">🎵 Music</div><div class="chip">📚 Study</div>
    <div class="chip">📅 Today</div><div class="chip" id="moodChip">💜 Mood: Warm</div>
  </div>
  <div class="input-box">
    <input id="textInput" placeholder="Ask Maya anything..." />
    <button onclick="sendText()">➤</button>
  </div>
</div>

<div id="settings">
  <h2>Settings - Ring Style</h2>
  <button onclick="closeSettings()">Close</button>
  <div class="grid">
    <div class="card" onclick="setTheme('rainbow')">Rainbow</div>
    <div class="card" onclick="setTheme('neon')">Neon Blue</div>
    <div class="card" onclick="setTheme('green')">Green Power</div>
    <div class="card" onclick="setTheme('purple')">Purple Storm</div>
    <div class="card" onclick="setTheme('fire')">Fire</div>
    <div class="card" onclick="setTheme('aqua')">Aqua Pink</div>
  </div>
</div>

<script src="app.js"></script>
</body>
                                </html>
