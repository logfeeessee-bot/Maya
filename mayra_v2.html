<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mayra</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b1220;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
:root{--g:#00ff88,#b6ff3d,#00ffd5,#00ff88;--a:0deg}
/* poori screen ki rangeen ring */
.ring{position:fixed;inset:0;border-radius:28px;padding:6px;pointer-events:none;z-index:20;
 background:conic-gradient(from var(--a),var(--g));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.ring.glow{filter:blur(12px);opacity:.85;padding:10px}
.app{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
 padding:calc(env(safe-area-inset-top,0px) + 22px) 22px calc(env(safe-area-inset-bottom,0px) + 22px)}
.top{width:100%;display:flex;justify-content:flex-end}
.gear{background:#16203a;border:0;color:#fff;border-radius:50%;width:42px;height:42px;font-size:20px;position:relative;z-index:25}
svg.logo{width:min(62vw,240px);height:auto;margin-top:-6px}
.arc1{transform-origin:130px 130px;animation:sp 6s linear infinite}
.arc2{transform-origin:130px 130px;animation:sp 9s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
canvas{flex:1;width:100%;min-height:0}
#status{color:#9fb0cc;font-size:14px;padding:4px 0 10px;text-align:center}
.mic{width:76px;height:76px;border-radius:50%;border:0;font-size:32px;color:#fff;background:linear-gradient(135deg,#4d7bff,#ff4da6);box-shadow:0 0 22px #6a5cff88}
.mic.on{animation:pl 1s infinite}
@keyframes pl{50%{transform:scale(1.14);box-shadow:0 0 36px #ff4da6}}
.chips{display:flex;gap:10px;margin-top:16px;width:100%}
.chip{flex:1;background:#16203a;border:0;color:#fff;border-radius:16px;padding:14px 4px;font-size:15px;font-weight:600}
/* settings */
#set{position:fixed;inset:0;background:#0b1220;z-index:30;padding:calc(env(safe-area-inset-top,0px) + 24px) 22px 30px;overflow-y:auto;transform:translateY(100%);transition:.35s}
#set.open{transform:none}
#set h2{margin-bottom:6px}#set p{color:#9fb0cc;font-size:14px;margin-bottom:18px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{aspect-ratio:9/16;border-radius:18px;border:4px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:12px;
 background:linear-gradient(#000,#000) padding-box,conic-gradient(from var(--a),var(--g)) border-box}
.card.sel{outline:3px solid #fff;outline-offset:2px}
.dot{width:70%;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
 background:radial-gradient(#000 56%,transparent 58%),conic-gradient(from var(--a),var(--g))}
.close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 20px);right:22px;background:#16203a;border:0;color:#fff;border-radius:50%;width:42px;height:42px;font-size:18px}
</style>
</head>
<body>
<div class="ring glow"></div><div class="ring"></div>

<div class="app">
  <div class="top"><button class="gear" onclick="openSet(true)">⚙</button></div>

  <svg class="logo" viewBox="0 0 260 260">
    <defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#8f7bff"/><stop offset="1" stop-color="#ff5ca8"/></linearGradient></defs>
    <circle cx="130" cy="130" r="120" fill="none" stroke="#1b2a55" stroke-width="2"/>
    <circle cx="130" cy="130" r="108" fill="none" stroke="#1b2a55" stroke-width="2"/>
    <circle class="arc1" cx="130" cy="130" r="120" fill="none" stroke="#4d7bff" stroke-width="6" stroke-linecap="round" stroke-dasharray="150 604"/>
    <circle class="arc2" cx="130" cy="130" r="108" fill="none" stroke="#c4c8d4" stroke-width="7" stroke-linecap="round" stroke-dasharray="200 479"/>
    <text x="130" y="100" text-anchor="middle" fill="#9aa5bd" font-size="12" letter-spacing="3" font-weight="600">AI ASSISTANT</text>
    <text x="130" y="140" text-anchor="middle" fill="url(#lg)" font-size="36" font-weight="800" letter-spacing="1">M.Y.R.A</text>
    <text x="130" y="170" text-anchor="middle" fill="#9aa5bd" font-size="11" letter-spacing="1.5" font-weight="600">HOW CAN I HELP YOU?</text>
  </svg>

  <canvas id="c"></canvas>
  <div id="status">Mayra ready hai</div>
  <button class="mic" id="mic" onclick="toggleMic()">🎤</button>
  <div class="chips">
    <button class="chip" onclick="chip('Music')">♪ Music</button>
    <button class="chip" onclick="chip('Study')">📖 Study</button>
    <button class="chip" onclick="chip('Journal')">✎ Journal</button>
  </div>
</div>

<div id="set">
  <button class="close" onclick="openSet(false)">✕</button>
  <h2>Settings</h2>
  <p>Ring style chuniye — ye poori screen par lagegi.</p>
  <div class="cards" id="cards"></div>
</div>

<script>
const STY=[
 {n:"Rainbow",c:["#ff3d3d","#ffb300","#7dff3d","#00e5ff","#7c4dff","#ff3df2","#ff3d3d"]},
 {n:"Neon Blue",c:["#00e5ff","#3d5afe","#b388ff","#ff4da6","#00e5ff"]},
 {n:"Green Power",c:["#00ff88","#b6ff3d","#00ffd5","#00ff88"]},
 {n:"Purple Storm",c:["#ff4de1","#8e24ff","#ff4de1","#4d6bff","#ff4de1"]},
 {n:"Fire",c:["#ff3d00","#ffb300","#ff3d00","#ff4da6","#ff3d00"]},
 {n:"Aqua Pink",c:["#00e5ff","#ff2bd6","#00e5ff"]}
];
let cur=2;
try{const s=localStorage.getItem('mayraStyle');if(s!==null)cur=+s}catch(e){}
const root=document.documentElement,cards=document.getElementById('cards');
STY.forEach((s,i)=>{
  const d=document.createElement('div');d.className='card';d.style.setProperty('--g',s.c.join(','));
  d.innerHTML=`<div class="dot">Mayra</div><span>${s.n}</span>`;
  d.onclick=()=>pick(i);cards.appendChild(d);
});
function pick(i){
  cur=i;try{localStorage.setItem('mayraStyle',i)}catch(e){}
  root.style.setProperty('--g',STY[i].c.join(','));
  [...cards.children].forEach((c,k)=>c.classList.toggle('sel',k===i));
}
pick(cur);
function openSet(v){document.getElementById('set').classList.toggle('open',v)}

/* ===== Particle sphere ===== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,R,ang=0,yaw=0,mode='idle',scatter=0,spin=0.006,pulse=1;
function resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);R=Math.min(W,H)*0.36}
addEventListener('resize',resize);resize();
const N=850,P=[];
for(let i=0;i<N;i++){const k=i+.5,ph=Math.acos(1-2*k/N),th=Math.PI*(1+Math.sqrt(5))*k;
  P.push({x:Math.sin(ph)*Math.cos(th),y:Math.cos(ph),z:Math.sin(ph)*Math.sin(th),ox:0,oy:0,oz:0,vx:0,vy:0,vz:0})}
function frame(){
  ang=(ang+0.7)%360;root.style.setProperty('--a',ang+'deg');
  const tS=mode==='speak'?1:0,tSp=mode==='listen'?0.07:(mode==='speak'?0.012:0.006);
  scatter+=(tS-scatter)*0.05;spin+=(tSp-spin)*0.08;yaw+=spin;
  const now=performance.now()/1000;
  pulse=mode==='listen'?1+0.1*Math.sin(now*9)+0.04*Math.sin(now*17):1+(pulse-1)*0.9;
  ctx.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,ca=Math.cos(yaw),sa=Math.sin(yaw),pal=STY[cur].c;
  for(let i=0;i<N;i++){const p=P[i];
    if(scatter>0.02&&mode==='speak'){
      p.vx+=(Math.random()-.5)*.05;p.vy+=(Math.random()-.5)*.05;p.vz+=(Math.random()-.5)*.05;
      p.vx*=.96;p.vy*=.96;p.vz*=.96;p.ox+=p.vx;p.oy+=p.vy;p.oz+=p.vz;
      const m=Math.hypot(p.ox,p.oy,p.oz);if(m>1.7){p.ox*=1.7/m;p.oy*=1.7/m;p.oz*=1.7/m}
    }else{p.ox*=.92;p.oy*=.92;p.oz*=.92;p.vx*=.8;p.vy*=.8;p.vz*=.8}
    const x=p.x+p.ox,y=p.y+p.oy,z=p.z+p.oz;
    const rx=x*ca-z*sa,rz=x*sa+z*ca,s=1/(1.8-rz*.35);
    ctx.globalAlpha=.35+.65*(rz+1.6)/3.2;
    ctx.fillStyle=pal[i%(pal.length-1)];
    ctx.beginPath();ctx.arc(cx+rx*R*s*1.3*pulse,cy+y*R*s*1.3*pulse,1.4+1.5*s,0,6.283);ctx.fill();
  }
  ctx.globalAlpha=1;requestAnimationFrame(frame);
}
frame();

/* ===== Mayra bolti / sunti hai ===== */
const st=document.getElementById('status'),micB=document.getElementById('mic');
function setMode(m,t){mode=m;micB.classList.toggle('on',m==='listen');
  st.textContent=t||({idle:'Mayra chup hai',listen:'Mayra sun rahi hai...',speak:'Mayra bol rahi hai...'})[m]}
function say(text){
  if(!window.speechSynthesis){st.textContent=text;return}
  const u=new SpeechSynthesisUtterance(text);u.lang='hi-IN';
  u.onstart=()=>setMode('speak',text);u.onend=u.onerror=()=>setMode('idle');
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
/* Yahan apna asli AI/API jodo: text aata hai, jawab say() se bolo */
function reply(t){
  const l=t.toLowerCase();
  if(/time|samay|baje|समय/.test(l))say('Abhi samay '+new Date().toLocaleTimeString('hi-IN')+' hai');
  else say('Aapne kaha: '+t);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec,listening=false;
async function keepAwake(){try{await navigator.wakeLock.request('screen')}catch(e){}}
function toggleMic(){
  keepAwake();
  if(!SR){alert('Is browser mein mic support nahi hai, Chrome use kijiye');return}
  if(listening){rec.stop();return}
  rec=new SR();rec.lang='hi-IN';
  rec.onstart=()=>{listening=true;setMode('listen')};
  rec.onresult=e=>reply(e.results[0][0].transcript);
  rec.onerror=()=>{setMode('idle','Mic nahi chala, permission check kijiye')};
  rec.onend=()=>{listening=false;if(mode==='listen')setMode('idle')};
  rec.start();
}
function chip(n){say(n+' mode shuru')}
</script>
</body>
  </html>
