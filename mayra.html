<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mayra</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07070f;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0)}
.top{width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.logo{font-size:28px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,#ff4d8d,#ffb347,#4dd2ff,#a66bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.gear{background:none;border:1px solid #444;color:#fff;border-radius:50%;width:42px;height:42px;font-size:20px}
canvas{flex:1;width:100%;min-height:0}
.status{padding:8px;color:#aaa;font-size:14px}
.btn{margin:8px 0 18px;padding:14px 28px;border:0;border-radius:30px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(90deg,#ff4d8d,#a66bff)}
#settings{position:absolute;inset:0;background:#0b0b18;padding:env(safe-area-inset-top,0) 16px 24px;transform:translateY(100%);transition:.35s;overflow-y:auto;z-index:5}
#settings.open{transform:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 12px;margin-top:20px;justify-items:center}
.person{display:flex;flex-direction:column;align-items:center;gap:8px}
.circle{width:104px;height:104px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;border:3px solid rgba(255,255,255,.85);box-shadow:0 0 18px var(--c)}
.person span{font-size:15px;color:#ddd}
</style>
</head>
<body>
<div class="screen">
  <div class="top"><div class="logo">Mayra</div><button class="gear" onclick="toggleSettings()">⚙</button></div>
  <canvas id="c"></canvas>
  <div class="status" id="status">Mayra chup hai</div>
  <button class="btn" onclick="demo()">Mayra se bulwao</button>
</div>

<div id="settings">
  <div class="top"><div class="logo">Mayra · Settings</div><button class="gear" onclick="toggleSettings()">✕</button></div>
  <div class="grid" id="grid"></div>
</div>

<script>
// ===== Yahan 8 logon ke naam badlo =====
const NAMES=["Naam 1","Naam 2","Naam 3","Naam 4","Naam 5","Naam 6","Naam 7","Naam 8"];
const COLORS=["#ff4d8d","#ffb347","#4dd2ff","#a66bff","#4dff9d","#ff6b4d","#ffe14d","#4d7bff"];

// ----- Settings: rangeen circle jisme "Mayra" likha hai -----
const grid=document.getElementById('grid');
NAMES.forEach((n,i)=>{
  const c=COLORS[i];
  grid.insertAdjacentHTML('beforeend',
   `<div class="person"><div class="circle" style="--c:${c};background:radial-gradient(circle at 30% 30%,${c},#1a1a2e)">Mayra</div><span>${n}</span></div>`);
});
function toggleSettings(){document.getElementById('settings').classList.toggle('open')}

// ----- Particle sphere -----
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,R,speaking=false,level=0,t=0;
function resize(){const d=devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);R=Math.min(W,H)*0.33}
addEventListener('resize',resize);resize();

const N=700,P=[];
for(let i=0;i<N;i++){
  // sphere ke upar barabar points (Fibonacci sphere)
  const k=i+0.5,phi=Math.acos(1-2*k/N),th=Math.PI*(1+Math.sqrt(5))*k;
  P.push({bx:Math.sin(phi)*Math.cos(th),by:Math.cos(phi),bz:Math.sin(phi)*Math.sin(th),
    ox:0,oy:0,oz:0,vx:0,vy:0,vz:0,hue:(i/N)*360});
}
function draw(){
  t+=0.01;
  level+=((speaking?1:0)-level)*0.06;
  ctx.clearRect(0,0,W,H);
  const cx=W/2,cy=H/2,ca=Math.cos(t),sa=Math.sin(t);
  for(const p of P){
    if(speaking){ // bolte waqt alag-alag bikhar jaate hain
      p.vx+=(Math.random()-.5)*0.05;p.vy+=(Math.random()-.5)*0.05;p.vz+=(Math.random()-.5)*0.05;
      p.vx*=.96;p.vy*=.96;p.vz*=.96;
      p.ox+=p.vx;p.oy+=p.vy;p.oz+=p.vz;
      const m=Math.hypot(p.ox,p.oy,p.oz);if(m>1.6){p.ox*=1.6/m;p.oy*=1.6/m;p.oz*=1.6/m}
    }else{ // chup hone par wapas ek gole mein
      p.ox*=.92;p.oy*=.92;p.oz*=.92;p.vx*=.8;p.vy*=.8;p.vz*=.8;
    }
    const x=p.bx+p.ox,y=p.by+p.oy,z=p.bz+p.oz;
    const rx=x*ca-z*sa,rz=x*sa+z*ca;
    const s=1/(1.8-rz*0.35);
    const px=cx+rx*R*s*1.3,py=cy+y*R*s*1.3;
    ctx.fillStyle=`hsla(${(p.hue+t*60)%360},90%,65%,${0.35+0.5*(rz+1.5)/3})`;
    ctx.beginPath();ctx.arc(px,py,1.3+1.4*s,0,6.283);ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();

// ----- Mayra bol rahi hai / chup hai -----
function setMayraSpeaking(v){
  speaking=v;
  document.getElementById('status').textContent=v?'Mayra bol rahi hai...':'Mayra chup hai';
}
// Apne app mein jab Mayra ki awaaz shuru ho: setMayraSpeaking(true)
// Jab awaaz band ho: setMayraSpeaking(false)

function demo(){
  const u=new SpeechSynthesisUtterance("Namaste, main Mayra hoon. Main aapki kya madad kar sakti hoon?");
  u.lang='hi-IN';
  u.onstart=()=>setMayraSpeaking(true);
  u.onend=u.onerror=()=>setMayraSpeaking(false);
  speechSynthesis.cancel();speechSynthesis.speak(u);
}
</script>
</body>
  </html>
