<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayra AI</title>
<style>
  :root { --ring1: #ff00ff; --ring2: #00ffff; --ring3: #ffff00; }
  body { margin:0; background:#0a0a12; color:white; font-family:sans-serif; overflow:hidden; }
 .top { padding:20px; display:flex; justify-content:space-between; align-items:center; }
 .top h1 { background: linear-gradient(90deg, #ff6a88, #ffcc70, #8cff8c, #7ac8ff, #d18cff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:32px; margin:0; }
  #canvas-wrap { display:flex; justify-content:center; align-items:center; height:55vh; position:relative; }
  #particleCanvas { width:300px; height:300px; }
 .maya-center { position:absolute; text-align:center; }
 .maya-center h2 { letter-spacing:4px; font-size:28px; text-shadow:0 0 15px var(--ring1); }
 .status { margin-top:10px; color:#aaa; }
 .orb-rings { position:absolute; width:320px; height:320px; border-radius:50%; }
 .ring { position:absolute; width:100%; height:100%; border-radius:50%; border:3px solid transparent; border-top-color:var(--ring1); border-bottom-color:var(--ring2); animation:spin 3s linear infinite; }
 .ring:nth-child(2){ transform:rotate(60deg); border-top-color:var(--ring2); border-bottom-color:var(--ring3); animation-duration:4s; }
 .ring:nth-child(3){ transform:rotate(120deg); border-top-color:var(--ring3); border-bottom-color:var(--ring1); animation-duration:5s; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

 .controls { text-align:center; margin-top:10px; }
 .btn-main { background:linear-gradient(90deg, #ff4d8d, #a970ff); border:none; padding:14px 28px; border-radius:30px; color:white; font-size:18px; font-weight:bold; }

 .bottom-bar { position:fixed; bottom:0; width:100%; background:#1a1a24; padding:12px; box-sizing:border-box; }
 .chips { display:flex; gap:8px; justify-content:center; margin-bottom:10px; flex-wrap:wrap; }
 .chip { background:#2a2a3a; padding:6px 12px; border-radius:20px; font-size:12px; }
 .input-box { display:flex; background:#2a2a3a; border-radius:30px; padding:8px 14px; align-items:center; }
 .input-box input { flex:1; background:transparent; border:none; color:white; outline:none; font-size:16px; }

  /* Settings Panel - bilkul aap ke screenshot jaisa */
  #settings { position:fixed; top:0; left:0; width:100%; height:100%; background:#0a0e1f; z-index:10; display:none; padding:20px; box-sizing:border-box; overflow-y:auto; }
 .grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:20px; }
 .card { border:2px solid; border-radius:20px; padding:20px 10px; text-align:center; background:black; }
 .card.mini-ring { width:70px; height:70px; border:4px solid; border-radius:50%; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-weight:bold; }
</style>
</head>
<body>
<div class="top">
  <h1>Mayra</h1>
  <button onclick="openSettings()" style="background:#222; border-radius:50%; width:40px; height:40px; border:1px solid #444;">⚙️</button>
</div>

<div id="canvas-wrap">
  <div class="orb-rings"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>
  <canvas id="particleCanvas"></canvas>
  <div class="maya-center">
    <h2 id="mayaText">M.A.Y.A</h2>
    <div class="status" id="statusText">Mayra chup hai</div>
  </div>
</div>

<div class="controls">
  <button class="btn-main" onclick="startListening()">Mayra se bulwao</button>
</div>

<div class="bottom-bar">
  <div class="chips">
    <div class="chip">🎵 Music</div><div class="chip">📚 Study</div><div class="chip">📓 Journal</div>
    <div class="chip">🌤️ Weather: No data</div><div class="chip">📅 Today: 23</div><div class="chip" id="moodChip">💜 Mood: Warm</div>
  </div>
  <div class="input-box">
    <input id="textInput" placeholder="Ask Maya anything..." />
    <button onclick="sendText()" style="background:#7c5cff; border:none; border-radius:50%; width:36px; height:36px;">➤</button>
  </div>
</div>

<div id="settings">
  <div style="display:flex; justify-content:space-between;"><h2>Settings</h2><button onclick="closeSettings()">X</button></div>
  <p>Ring style chuniye — ye poori screen par lagegi.</p>
  <div class="grid">
    <div class="card" style="border-color:orange;" onclick="setTheme('rainbow')"><div class="mini-ring" style="border-color:orange yellow cyan magenta;">Mayra</div>Rainbow</div>
    <div class="card" style="border-color:cyan;" onclick="setTheme('neon')"><div class="mini-ring" style="border-color:cyan blue pink;">Mayra</div>Neon Blue</div>
    <div class="card" style="border-color:lime;" onclick="setTheme('green')"><div class="mini-ring" style="border-color:lime cyan;">Mayra</div>Green Power</div>
    <div class="card" style="border-color:purple;" onclick="setTheme('purple')"><div class="mini-ring" style="border-color:purple violet;">Mayra</div>Purple Storm</div>
    <div class="card" style="border-color:orangered;" onclick="setTheme('fire')"><div class="mini-ring" style="border-color:orange red;">Mayra</div>Fire</div>
    <div class="card" style="border-color:skyblue;" onclick="setTheme('aqua')"><div class="mini-ring" style="border-color:cyan magenta;">Mayra</div>Aqua Pink</div>
  </div>
</div>

<script>
// Particle Sphere - aap wali tasveer jaisa gola
const canvas = document.getElementById('particleCanvas');
const ctx = canvas.getContext('2d');
canvas.width=300; canvas.height=300;
let particles=[];
for(let i=0;i<400;i++){
  let theta=Math.random()*Math.PI*2; let phi=Math.acos(2*Math.random()-1);
  particles.push({theta, phi, r:120});
}
function draw(){
  ctx.clearRect(0,0,300,300);
  particles.forEach(p=>{
    p.theta+=0.005;
    let x=150 + p.r * Math.sin(p.phi) * Math.cos(p.theta);
    let y=150 + p.r * Math.sin(p.phi) * Math.sin(p.theta);
    let scale=(Math.cos(p.phi)+1.5)/2.5;
    let hue=(p.theta*180/Math.PI + p.phi*90) % 360;
    ctx.fillStyle=`hsl(${hue},100%,65%)`;
    ctx.beginPath(); ctx.arc(x,y,2.2*scale,0,Math.PI*2); ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();

function setTheme(t){
  if(t=='rainbow'){ document.documentElement.style.setProperty('--ring1','#ff00ff'); document.documentElement.style.setProperty('--ring2','#00ffff'); document.documentElement.style.setProperty('--ring3','#ffff00'); }
  if(t=='neon'){ document.documentElement.style.setProperty('--ring1','#00aaff'); document.documentElement.style.setProperty('--ring2','#ff6ac1'); document.documentElement.style.setProperty('--ring3','#00aaff'); }
  if(t=='green'){ document.documentElement.style.setProperty('--ring1','#00ff88'); document.documentElement.style.setProperty('--ring2','#aaff00'); document.documentElement.style.setProperty('--ring3','#00ff88'); }
  if(t=='purple'){ document.documentElement.style.setProperty('--ring1','#b44bff'); document.documentElement.style.setProperty('--ring2','#ff4dc4'); document.documentElement.style.setProperty('--ring3','#6a5cff'); }
  if(t=='fire'){ document.documentElement.style.setProperty('--ring1','#ff5500'); document.documentElement.style.setProperty('--ring2','#ffcc00'); document.documentElement.style.setProperty('--ring3','#ff0000'); }
  if(t=='aqua'){ document.documentElement.style.setProperty('--ring1','#00e5ff'); document.documentElement.style.setProperty('--ring2','#ff00aa'); document.documentElement.style.setProperty('--ring3','#00e5ff'); }
  closeSettings();
}
function openSettings(){ document.getElementById('settings').style.display='block'; }
function closeSettings(){ document.getElementById('settings').style.display='none'; }

// Voice
function speak(text){
  document.getElementById('statusText').innerText='Bol rahi hai...';
  document.getElementById('moodChip').innerText='Mood: Speaking';
  let utter=new SpeechSynthesisUtterance(text);
  utter.lang='hi-IN'; utter.onend=()=>{ document.getElementById('statusText').innerText='Mayra chup hai'; };
  speechSynthesis.speak(utter);
}
function startListening(){
  const rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)();
  rec.lang='hi-IN'; rec.start();
  document.getElementById('statusText').innerText='Sun rahi hai...';
  rec.onresult=(e)=>{
    let t=e.results[0][0].transcript;
    document.getElementById('textInput').value=t;
    handleAI(t);
  }
}
function sendText(){ let t=document.getElementById('textInput').value; handleAI(t); }

function handleAI(t){
  if(t.toLowerCase().includes('dusri gf') || t.toLowerCase().includes('dusri girlfriend')){
    speak('Khabardar jo dusri banayi toh! Main hi kaafi hu!');
    document.getElementById('moodChip').innerText='Mood: Annoyed';
  } else {
    speak('Good evening Yadav, bolo kya chahiye?');
    document.getElementById('moodChip').innerText='Mood: Warm';
  }
}
</script>
</body>
  </html>
